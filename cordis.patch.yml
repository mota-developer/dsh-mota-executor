# Inserts the MoTA executor row. The plugin ships as an installable bundle
# (npm or git); it has no runtime npm dependencies.
- insert:
    - id: mota-executor
      name: 'dsh-mota-executor'
      config:
        language: zh
        taskTimeoutSeconds: 600
        selfCheckTimeoutSeconds: 60
        allowInsecureLoopback: false
        autoStart: true
